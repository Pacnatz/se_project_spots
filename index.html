<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="A TripleTen sprint website that spans multiple sprints."/><meta name="author" content="Nhat Chu"/><meta name="keywords" content="TripleTen, Web development, HTML, CSS"/><link rel="icon" href="favicon.ico"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="8bd92903aece9fed9ac5.svg" alt="Spots Logo" class="header__logo"/></header><main class="content"><section class="profile"><div class="profile__avatar-container"><button class="profile__avatar-btn"><img src="8a8db2b8a0a388f4e2f7.svg" alt="Pencil Icon" class="profile__pencil-icon"/></button> <img src="2fc47fd8e9a9bcd9612f.jpg" alt="Profile Avatar" class="profile__avatar"/></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button class="profile__edit-btn" type="button"><img src="3f562ce83766a824571e.svg" alt="Edit Profile Icon" class="profile__edit-icon"/> <span class="profile__edit-text">Edit Profile</span></button></div><button class="profile__new-post-btn" type="button"><img src="975792ea68af0a3c209d.svg" alt="New Post Icon" class="profile__new-post-icon"/> <span class="profile__new-post-text">New Post</span></button></section><section class="cards"><ul class="cards__list"><template id="cards__template"><li class="card"><img src="#" alt="" class="card__img"/><h2 class="card__title"></h2><button class="card__like-btn" type="button"></button> <button class="card__delete-btn" type="button"></button></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2025 &copy; Spots</p></footer><div id="edit-profile-modal" class="modal"><div class="modal__container"><button type="button" aria-label="Close Modal" class="modal__close-btn"></button><h2 class="modal__title">Edit profile</h2><form id="profile-form" class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" required minlength="2" maxlength="40"/> <span id="profile-name-input-error" class="modal__error">ERROR!</span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" required minlength="2" maxlength="200"/> <span id="profile-description-input-error" class="modal__error">ERROR!</span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div id="edit-avatar-modal" class="modal"><div class="modal__container"><button type="button" aria-label="Close Modal" class="modal__close-btn"></button><h2 class="modal__title">Edit profile avatar</h2><form id="edit-avatar-form" class="modal__form" novalidate><label for="edit-avatar-input" class="modal__label">Profile Picture <input id="edit-avatar-input" type="url" class="modal__input" name="avatar" placeholder="Paste the link to an image" required/> <span id="edit-avatar-input-error" class="modal__error">ERROR!</span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div id="new-post-modal" class="modal"><div class="modal__container"><button type="button" aria-label="Close Modal" class="modal__close-btn"></button><h2 class="modal__title">New Post</h2><form id="new-post-form" class="modal__form" novalidate><label for="card-image-input" class="modal__label">Image Link <input id="card-image-input" type="url" class="modal__input" placeholder="Place a link to the picture" required/> <span id="card-image-input-error" class="modal__error">ERROR!</span></label> <label for="card-caption-input" class="modal__label">Caption <input id="card-caption-input" class="modal__input" placeholder="Type your caption" required minlength="2" maxlength="30"/> <span id="card-caption-input-error" class="modal__error">ERROR!</span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div id="delete-post-modal" class="modal"><div class="modal__container modal__container_type_delete"><button type="button" aria-label="Close Modal" class="modal__close-btn modal__close-btn_type_delete"></button><h2 class="modal__title modal__title_type_delete">Are you sure you want to delete this image?</h2><form id="delete-card-form" class="modal__form modal__form_type_delete" novalidate><button type="submit" class="modal__submit-btn modal__submit-btn_type_delete">Delete</button> <button type="button" class="modal__submit-btn modal__submit-btn_type_cancel">Cancel</button></form></div></div><div id="preview-modal" class="modal modal_type_preview"><div class="modal__image-container"><button type="button" class="modal__close-btn modal__close-btn_type_preview"></button> <img src="#" alt="" class="modal__picture"/><p class="modal__caption"></p></div></div></div></body></html>
